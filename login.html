<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · Habitask</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");
      :root {
        --bg-left: #000328;
        --bg-right: #00458e;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #5b667a;
        --accent: #00458e;
        --shadow: rgba(15, 23, 42, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Poppins", system-ui, sans-serif;
        background: linear-gradient(120deg, var(--bg-left), var(--bg-right));
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border-radius: 20px;
        padding: 28px;
        width: min(420px, 100%);
        box-shadow: 0 20px 50px -30px var(--shadow);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      button {
        font: inherit;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        width: 100%;
        margin-top: 8px;
      }
      .link {
        background: none;
        border: none;
        color: var(--accent);
        text-decoration: underline;
        cursor: pointer;
        font-size: 13px;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome</h1>
      <p>Please log in to access your dashboard.</p>
      <button id="loginBtn" type="button">Log In</button>
      <button id="forgotBtn" type="button" class="link">Forgot password?</button>
      <p class="note" id="authMessage">Invite only. If you do not have an invite, ask the site owner.</p>
    </div>

    <script>
      const loginBtn = document.getElementById("loginBtn");
      const forgotBtn = document.getElementById("forgotBtn");
      const authMessage = document.getElementById("authMessage");

      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const isInvite =
        hashParams.has("invite_token") ||
        hashParams.has("confirmation_token") ||
        hashParams.has("token");

      loginBtn.addEventListener("click", () => {
        if (window.netlifyIdentity) {
          window.netlifyIdentity.open(isInvite ? "signup" : "login");
        }
      });

      forgotBtn.addEventListener("click", () => {
        if (window.netlifyIdentity) {
          window.netlifyIdentity.open("login");
        }
      });

      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (user) {
            window.location.href = "/";
            return;
          }
          if (isInvite) {
            window.netlifyIdentity.open("signup");
          }
        });
        window.netlifyIdentity.on("login", () => {
          window.location.href = "/";
        });
        window.netlifyIdentity.on("error", () => {
          if (authMessage) {
            authMessage.textContent = "Invite required. Ask the owner to add your email.";
          }
        });
        window.netlifyIdentity.init();
      }
    </script>
  </body>
</html>
